server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vulnerable_app_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: vulnerableapp
          __path__: /var/log/VulnerableApp/*.txt
    pipeline_stages:
      - regex:
          expression: "(?P<categoria>(Security|Audit))"
      - labels:
          categoria:
